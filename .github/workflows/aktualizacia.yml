# Každých 30 minút stiahne aktuálne údaje z webu obce a zverejní aplikáciu na GitHub Pages.
name: Aktualizácia údajov a zverejnenie

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aktualizacia
  cancel-in-progress: false

jobs:
  aktualizacia:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stiahnuť údaje z podbranc.sk
        run: python scripts/update_data.py

      - name: Uložiť zmenené údaje
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Aktualizácia údajov z podbranc.sk"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Zverejní sa len pri zmene údajov alebo kódu, nie pri každej kontrole.
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deploy
        uses: actions/deploy-pages@v4
